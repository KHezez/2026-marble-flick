name: Windows single EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.spec'
      - 'windows_version.txt'
      - 'requirements*.txt'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/windows-exe.yml'
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
concurrency:
  group: windows-exe-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Source regression tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          MARBLE_SAVE_PATH: ${{ runner.temp }}\marble-source-test.json
        shell: python
        run: |
          import pathlib, subprocess, sys
          r = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
          pathlib.Path('source-tests.log').write_text(r.stdout, encoding='utf-8')
          print(r.stdout)
          if r.returncode:
              message = r.stdout[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Source test failures::' + message)
          sys.exit(r.returncode)
      - name: Build one-file GUI EXE
        shell: python
        run: |
          import pathlib, subprocess, sys
          r = subprocess.run([sys.executable, '-m', 'PyInstaller', '--clean', '--noconfirm', 'MarbleFlick.spec'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
          pathlib.Path('build-exe.log').write_text(r.stdout, encoding='utf-8')
          print(r.stdout)
          if r.returncode:
              message = r.stdout[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=EXE build failure::' + message)
          sys.exit(r.returncode)
      - name: Test the actual EXE including two-process LAN
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'windows-exe-test.json'
          $process = Start-Process -FilePath '.\dist\MarbleFlick.exe' -ArgumentList @('--self-test', $report) -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'EXE self-test timed out' }
          if (Test-Path $report) { Get-Content $report; Copy-Item $report dist/windows-exe-test.json }
          if ($process.ExitCode -ne 0) {
            $details = (Get-Content $report) -join '%0A'
            Write-Output "::error title=EXE smoke failure::$details"
            throw "EXE self-test failed: $($process.ExitCode)"
          }
          $check = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $check.ok -or $check.two_exe_lan -ne 'passed') { throw 'EXE verification incomplete' }
          $hash = (Get-FileHash dist/MarbleFlick.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MarbleFlick.exe" | Set-Content dist/MarbleFlick.exe.sha256 -Encoding ascii
          Copy-Item EXE_README_KO.md dist/EXE_README_KO.md
      - name: Build log summary
        if: always()
        shell: pwsh
        run: |
          foreach ($file in @('source-tests.log', 'build-exe.log')) {
            if (Test-Path $file) {
              "### $file" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content $file -Tail 50 >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MarbleFlick-Windows-x64
          path: |
            dist/MarbleFlick.exe
            dist/MarbleFlick.exe.sha256
            dist/windows-exe-test.json
            dist/EXE_README_KO.md
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MarbleFlick-Windows-x64
          path: release-files
      - name: Publish tested executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v0.8.1 >/dev/null 2>&1; then
            gh release create v0.8.1 --target "$GITHUB_SHA" --title 'Marble Flick v0.8.1 — Windows single EXE' --notes-file EXE_README_KO.md
          fi
          gh release upload v0.8.1 release-files/MarbleFlick.exe release-files/MarbleFlick.exe.sha256 release-files/windows-exe-test.json release-files/EXE_README_KO.md --clobber
      - name: Record Windows verification in repository
        run: |
          cp release-files/windows-exe-test.json validation/v081/windows-exe-test.json
          cp release-files/MarbleFlick.exe.sha256 validation/v081/MarbleFlick.exe.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/v081/windows-exe-test.json validation/v081/MarbleFlick.exe.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified Windows EXE build [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
